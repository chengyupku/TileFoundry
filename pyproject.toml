[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tilefoundry"
dynamic = ["version"]
description = "Typed CP-SAT scheduling for warpgroup tile-operation pipelines."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tile-ai" }]
dependencies = [
    "ortools>=9.15",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/tile-ai/TileFoundry"
Repository = "https://github.com/tile-ai/TileFoundry"

[project.scripts]
tilefoundry = "tilefoundry.cli:main"

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5", "mypy>=1.15,<2", "pytest>=8", "ruff>=0.11,<1"]
dev = ["pre-commit>=3"]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/tilefoundry/docs" = ["docs/*.md"]
"share/tilefoundry/spec" = ["docs/spec/*.md"]
"share/tilefoundry/schemas" = ["schemas/*.json"]

[tool.ruff]
# Snapshot examples are evidence; reformatting them to satisfy lint would change that evidence.
extend-exclude = ["examples"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selected rule families:
#   E, W  pycodestyle (PEP 8 errors / warnings)
#   F     pyflakes    (unused / undefined / shadowed)
#   I     isort       (import order)
# Plus targeted rules from pylint and flake8-tidy-imports:
#   PLC0415  import-outside-top-level
#   TID251   banned-api
select = ["E", "F", "W", "I", "PLC0415", "TID251"]

# Long schemas and equations remain readable on one line; compact algebra uses
# conventional single-letter names.
ignore = ["E501", "F821", "E741"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Use quoted forward references; TYPE_CHECKING shims are not used in TileFoundry."
"typing_extensions.TYPE_CHECKING".msg = "Use quoted forward references; TYPE_CHECKING shims are not used in TileFoundry."
